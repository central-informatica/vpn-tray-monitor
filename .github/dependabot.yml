# Atualizações semanais (spec §10.4): módulos Go (o principal e o do
# go-winres) e as actions, que seguem fixadas por SHA nos PRs do Dependabot.
version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - "/"
      - "/tools/winres"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
